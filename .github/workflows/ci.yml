name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx nox -s lint

  sqlite:
    name: sqlite ${{ matrix.pair }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: &pairs
        pair:
          - 5.2-py3.11
          - 5.2-py3.12
          - 5.2-py3.13
          - 5.2-py3.14
          - 6.0-py3.12
          - 6.0-py3.13
          - 6.0-py3.14
          - 6.1-py3.12
          - 6.1-py3.13
          - 6.1-py3.14
          - 6.1-py3.15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx nox -s "tests(${{ matrix.pair }})"

  postgres:
    name: postgres ${{ matrix.pair }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: *pairs
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DTD_TEST_DB: postgres
      DTD_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create test roles
        run: psql -v ON_ERROR_STOP=1 -f docker/init-roles.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
      - run: uvx nox -s "tests(${{ matrix.pair }})"

  # One version, checked against the checksum its project publishes, so a new gitleaks can't
  # change this result or reach the runner unnoticed.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: No secrets in the tree
        run: gitleaks dir . --ignore-gitleaks-allow --no-banner --redact --exit-code 1
